name: Honeydew

results:
  - dir: ${instrument}/results

commands:
  - name: run honeydew
    win: .\bin\win-x64\Honeydew.exe extract "${repo}" ${options}
    unix: |
      # Pick the build for this machine's CPU. On a Mac, hw.optional.arm64 is 1 on Apple Silicon
      # even when this shell runs under Rosetta, so an x64 JVM still gets the arm64 build.
      if [[ "$OSTYPE" == "darwin"* ]]; then
        if [[ "$(sysctl -n hw.optional.arm64 2>/dev/null)" == "1" ]]; then rid=osx-arm64; else rid=osx-x64; fi
      else
        case "$(uname -m)" in aarch64|arm64) rid=linux-arm64 ;; *) rid=linux-x64 ;; esac
      fi
      chmod +x ./bin/$rid/Honeydew && ./bin/$rid/Honeydew extract "${repo}" ${options}

parameters:
  options: "--no-progress-bars"
