name: Release Voyager

on:
  push:
    tags:
      - 'v*-voyager'

jobs:
  build-and-publish:
    name: Build and Publish
    # macOS builds run on macOS: the SDK only code-signs the osx apphost on a Mac,
    # and Apple Silicon refuses to start an unsigned arm64 binary.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { rid: win-x64, os: ubuntu-latest }
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-latest }
          - { rid: osx-x64, os: macos-latest }
          - { rid: osx-arm64, os: macos-latest }
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract Semver
        id: semver_parser
        run: |
          semver=${TAG#"refs/tags/v"}
          semver=${semver%"-voyager"}
          echo "semver=${semver}" >> $GITHUB_OUTPUT
        env:
          TAG: ${{ github.ref }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Release for OS
        run: |
          mkdir -p bin
          dotnet publish -r ${{ matrix.rid }} --self-contained false -p:PublishSingleFile=false -o bin -c Release -p:Version=${{ steps.semver_parser.outputs.semver }} Honeydew/Honeydew.csproj

      - name: Prepare Assets
        run: |
          mkdir -p ${{ matrix.rid }}
          find bin -name '*.pdb' -delete || true
          cp -a bin/. ${{ matrix.rid }}/

      - name: Create Archive
        run: zip -r honeydew-${{ matrix.rid }}.zip ${{ matrix.rid }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: honeydew-${{ matrix.rid }}.zip
          path: honeydew-${{ matrix.rid }}.zip

  release-and-upload:
    name: Release Honeydew for Voyager
    runs-on: ubuntu-latest
    needs: build-and-publish
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Extract Semver
        id: semver_parser
        run: |
          semver=${TAG#"refs/tags/v"}
          semver=${semver%"-voyager"}
          echo "semver=${semver}" >> $GITHUB_OUTPUT
        env:
          TAG: ${{ github.ref }}

      - name: Prepare Assets
        run: |
          mkdir -p honeydew/results
          mkdir -p honeydew/bin

          cp README.md honeydew/README.md
          cp instrument.yml honeydew/instrument.yml

          unzip ./honeydew-win-x64.zip/honeydew-win-x64.zip -d honeydew/bin
          unzip ./honeydew-linux-x64.zip/honeydew-linux-x64.zip -d honeydew/bin
          unzip ./honeydew-linux-arm64.zip/honeydew-linux-arm64.zip -d honeydew/bin
          unzip ./honeydew-osx-x64.zip/honeydew-osx-x64.zip -d honeydew/bin
          unzip ./honeydew-osx-arm64.zip/honeydew-osx-arm64.zip -d honeydew/bin

          ls -al -R honeydew

          chmod +x honeydew/bin/win-x64/Honeydew.exe
          chmod +x honeydew/bin/linux-x64/Honeydew
          chmod +x honeydew/bin/linux-arm64/Honeydew
          chmod +x honeydew/bin/osx-x64/Honeydew
          chmod +x honeydew/bin/osx-arm64/Honeydew

      - name: Zip Voyager Release
        run: zip -rl honeydew.zip honeydew

      - name: Prepare Release Notes
        run: touch ${{ github.workspace }}/releaseNotes/v${{ steps.semver_parser.outputs.semver }}.md

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          name: Honeydew ${{ steps.semver_parser.outputs.semver }} (Voyager)
          body_path: ${{ github.workspace }}/releaseNotes/v${{ steps.semver_parser.outputs.semver }}.md
          body: ""
          prerelease: false
          draft: false
          files: honeydew.zip
