name: Release Voyager

on:
  push:
    tags:
      - 'v*-voyager'

jobs:
  build-and-publish:
    name: Build and Publish
    # macOS builds run on macOS: the SDK only code-signs the osx apphost on a Mac,
    # and Apple Silicon refuses to start an unsigned arm64 binary.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { rid: win-x64, os: ubuntu-latest }
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-latest }
          - { rid: osx-x64, os: macos-latest }
          - { rid: osx-arm64, os: macos-latest }
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract Semver
        id: semver_parser
        run: |
          semver=${TAG#"refs/tags/v"}
          semver=${semver%"-voyager"}
          echo "semver=${semver}" >> $GITHUB_OUTPUT
        env:
          TAG: ${{ github.ref }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Release for OS
        run: |
          mkdir -p bin
          dotnet publish -r ${{ matrix.rid }} --self-contained false -p:PublishSingleFile=false -o bin -c Release -p:Version=${{ steps.semver_parser.outputs.semver }} Honeydew/Honeydew.csproj

      # Developer ID signing + Apple notarization of the macOS apphost, so Gatekeeper
      # accepts it even when the bundle was downloaded with a browser (quarantine).
      # Without the secrets the step only warns: the build keeps the SDK's ad-hoc
      # signature, which is enough to run when nothing quarantined it.
      - name: Sign and notarize (macOS)
        if: startsWith(matrix.rid, 'osx-')
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          # App Store Connect API team key (role Developer) for the notary service.
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_CERT_P12_BASE64" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::warning::macOS signing secrets not set; ${{ matrix.rid }} ships ad-hoc signed only (not notarized)."
            exit 0
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(openssl rand -base64 24)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          # Developer ID certs are issued by Apple's G2 intermediate, which a fresh
          # macOS install may lack; without it the identity is not valid for signing.
          # Pinned SHA-256 of Apple's DeveloperIDG2CA.cer (valid until 2031-09-17); a different file stops the release.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $RUNNER_TEMP/DeveloperIDG2CA.cer" | shasum -a 256 -c -
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" || true
          security set-key-partition-list -S apple-tool:,apple: -k "$kc_pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          identity="$(security find-identity -v -p codesigning "$keychain" | grep 'Developer ID Application' | head -1 | awk '{print $2}')"
          if [ -z "$identity" ]; then echo "::error::No 'Developer ID Application' identity in the certificate."; exit 1; fi

          codesign --force --options runtime --timestamp \
            --entitlements .github/macos/honeydew.entitlements \
            --sign "$identity" bin/Honeydew
          codesign --verify --strict --verbose=2 bin/Honeydew

          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
          notary_auth=(--key "$RUNNER_TEMP/notary-key.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")

          ditto -c -k --keepParent bin/Honeydew "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${notary_auth[@]}" \
            --wait --timeout 2h --output-format json | tee "$RUNNER_TEMP/notary.json"
          status="$(plutil -extract status raw -o - "$RUNNER_TEMP/notary.json" 2>/dev/null || true)"
          if [ "$status" != "Accepted" ]; then
            id="$(plutil -extract id raw -o - "$RUNNER_TEMP/notary.json" 2>/dev/null || true)"
            [ -n "$id" ] && xcrun notarytool log "$id" "${notary_auth[@]}" || true
            echo "::error::Notarization status: ${status:-unknown}"
            exit 1
          fi

      - name: Remove signing keychain
        if: always() && startsWith(matrix.rid, 'osx-')
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/cert.p12"

      - name: Prepare Assets
        run: |
          mkdir -p ${{ matrix.rid }}
          find bin -name '*.pdb' -delete || true
          cp -a bin/. ${{ matrix.rid }}/

      - name: Create Archive
        run: zip -r honeydew-${{ matrix.rid }}.zip ${{ matrix.rid }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: honeydew-${{ matrix.rid }}.zip
          path: honeydew-${{ matrix.rid }}.zip

  release-and-upload:
    name: Release Honeydew for Voyager
    runs-on: ubuntu-latest
    needs: build-and-publish
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Extract Semver
        id: semver_parser
        run: |
          semver=${TAG#"refs/tags/v"}
          semver=${semver%"-voyager"}
          echo "semver=${semver}" >> $GITHUB_OUTPUT
        env:
          TAG: ${{ github.ref }}

      - name: Prepare Assets
        run: |
          mkdir -p honeydew/results
          mkdir -p honeydew/bin

          cp README.md honeydew/README.md
          cp instrument.yml honeydew/instrument.yml

          unzip ./honeydew-win-x64.zip/honeydew-win-x64.zip -d honeydew/bin
          unzip ./honeydew-linux-x64.zip/honeydew-linux-x64.zip -d honeydew/bin
          unzip ./honeydew-linux-arm64.zip/honeydew-linux-arm64.zip -d honeydew/bin
          unzip ./honeydew-osx-x64.zip/honeydew-osx-x64.zip -d honeydew/bin
          unzip ./honeydew-osx-arm64.zip/honeydew-osx-arm64.zip -d honeydew/bin

          ls -al -R honeydew

          chmod +x honeydew/bin/win-x64/Honeydew.exe
          chmod +x honeydew/bin/linux-x64/Honeydew
          chmod +x honeydew/bin/linux-arm64/Honeydew
          chmod +x honeydew/bin/osx-x64/Honeydew
          chmod +x honeydew/bin/osx-arm64/Honeydew

      - name: Zip Voyager Release
        run: zip -rl honeydew.zip honeydew

      - name: Prepare Release Notes
        run: touch ${{ github.workspace }}/releaseNotes/v${{ steps.semver_parser.outputs.semver }}.md

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          name: Honeydew ${{ steps.semver_parser.outputs.semver }} (Voyager)
          body_path: ${{ github.workspace }}/releaseNotes/v${{ steps.semver_parser.outputs.semver }}.md
          body: ""
          prerelease: false
          draft: false
          files: honeydew.zip
