site_name: Honeydew Docs
repo_url: https://github.com/dxworks/honeydew

theme:
  name: material
  palette:
    # Toggle light mode
    - scheme: default
      media: "(prefers-color-scheme: light)"
      primary: amber
      accent: pink
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode

    # Toggle dark mode
    - scheme: slate
      media: "(prefers-color-scheme: dark)"
      primary: amber
      accent: pink
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  features:
    - navigation.expand
    - navigation.indexes
    - navigation.instant
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/dxworks-theme.css

nav:
  - Home: index.md
  - Installation: installation.md
  - Commands:
      - Extract: commands/extract.md
      - Load: commands/load.md
      - Adapt: commands/adapt.md
  - Model:
      - Types: model/types.md
      - Extractor: model/extractor.md
  - Results:
      - Raw: model_results/raw.md
      - Spektrum: model_results/spektrum.md
      - Relations: model_results/relations.md
      - Other: model_results/other.md
  - ScriptBee:
      - Integration: scriptbee/integration.md
      - Model: scriptbee/model.md
