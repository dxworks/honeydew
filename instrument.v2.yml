name: Honeydew
id: honeydew
version: 3.2.3

actions:
  verify:
    with:
      requirements:
        - name: .NET SDK 10+
          min: 10.0.0
          command: dotnet --version
          match:
            - '(?<version>.+)'
        - name: Python 3.9+
          min: 3.9.0
          command:
            windows: py -3 --version >nul 2>nul & if not errorlevel 1 (py -3 --version) else (python --version)
            unix: if command -v python3 >/dev/null 2>&1; then python3 --version; else python --version; fi
          match:
            - 'Python (?<version>.+)'
  start:
    parameters:
      options: '--no-progress-bars'
    commands:
      run-honeydew:
        id: run-honeydew
        dir: ${instrumentPath}
        command:
          windows: .\bin\win-x64\Honeydew.exe extract "${repo}" ${options}
          unix: >-
            if [[ "$OSTYPE" == "darwin"* ]]; then
              if [[ "$(sysctl -n hw.optional.arm64 2>/dev/null)" == "1" ]]; then rid=osx-arm64; else rid=osx-x64; fi
            else
              case "$(uname -m)" in aarch64|arm64) rid=linux-arm64 ;; *) rid=linux-x64 ;; esac
            fi;
            chmod +x ./bin/$rid/Honeydew && ./bin/$rid/Honeydew extract "${repo}" ${options}

  summary:
    md-file: results/summary.md
    html-file: results/summary.html
    category: Structural Relations
    commands:
      generate-summary:
        id: generate-summary
        dir: ${instrumentPath}
        command:
          windows: py -3 --version >nul 2>nul & if not errorlevel 1 (py -3 honeydew-summary.py "${instrumentPath}/results") else (python honeydew-summary.py "${instrumentPath}/results")
          unix: if command -v python3 >/dev/null 2>&1; then python3 honeydew-summary.py "${instrumentPath}/results"; else python honeydew-summary.py "${instrumentPath}/results"; fi

  clean:
    with:
      locations:
        - source: ${instrumentDir}/results

  pack:
    with:
      locations:
        - source: ${instrumentDir}/results
          destination: /results
